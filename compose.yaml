name: lzt2-mongostack

services:
  mongo:
    image: bitnamilegacy/mongodb:8.0
    platform: ${MONGO_PLATFORM:-linux/amd64}
    container_name: lzt2-mongo
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - bash
      - -lc
    command:
      - |
        set -euo pipefail
        mkdir -p /bitnami/mongodb/data/db
        exec /opt/bitnami/mongodb/bin/mongod \
          --replSet rs0 \
          --bind_ip_all \
          --port 27017 \
          --wiredTigerCacheSizeGB 0.5 \
          --dbpath /bitnami/mongodb/data/db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/bitnami/mongodb

  mongo-init:
    image: bitnamilegacy/mongodb:8.0
    platform: ${MONGO_PLATFORM:-linux/amd64}
    container_name: lzt2-mongo-init
    restart: "no"
    depends_on:
      - mongo
    entrypoint:
      - bash
      - -lc
    command:
      - |
        set -euo pipefail
        until /opt/bitnami/mongodb/bin/mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; do
          sleep 1
        done
        /opt/bitnami/mongodb/bin/mongosh --host mongo:27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }).ok }'

  postgres:
    image: postgres:18
    container_name: lzt2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lzt2
      POSTGRES_USER: lzt2
      POSTGRES_PASSWORD: lzt2-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lzt2 -d lzt2"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30

volumes:
  mongo-data:
  postgres-data:
